<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8E6A1"/>
      <stop offset="1" stop-color="#FFE5B4"/>
    </linearGradient>
    <radialGradient id="leafG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7BC96F"/>
      <stop offset="1" stop-color="#3F8F4A"/>
    </radialGradient>
    <symbol id="leaf" viewBox="-50 -50 100 100">
      <path d="M0,-45 C30,-30 40,0 0,45 C-40,0 -30,-30 0,-45 Z" fill="url(#leafG)" stroke="#2E6F38" stroke-width="3"/>
      <line x1="0" y1="-40" x2="0" y2="40" stroke="#2E6F38" stroke-width="2"/>
    </symbol>
    <symbol id="dino" viewBox="-100 -100 200 200">
      <ellipse cx="0" cy="20" rx="70" ry="50" fill="#7DD87D" stroke="#2E6F38" stroke-width="4"/>
      <circle cx="-45" cy="-30" r="40" fill="#7DD87D" stroke="#2E6F38" stroke-width="4"/>
      <ellipse cx="-30" cy="-25" rx="6" ry="9" fill="#1a1a1a"/>
      <circle cx="-26" cy="-29" r="3" fill="#fff"/>
      <path d="M-75,-30 Q-90,-25 -82,-15" fill="none" stroke="#2E6F38" stroke-width="4" stroke-linecap="round"/>
      <path d="M-15,-50 L-5,-65 L5,-50 L20,-65 L30,-50 L45,-65" fill="none" stroke="#FFD93D" stroke-width="6" stroke-linejoin="round"/>
      <ellipse cx="-30" cy="60" rx="14" ry="22" fill="#5BAA5B"/>
      <ellipse cx="30" cy="60" rx="14" ry="22" fill="#5BAA5B"/>
      <circle cx="-15" cy="10" r="5" fill="#FFB6C1" opacity="0.7"/>
      <path d="M40,30 Q70,20 80,40 Q70,50 50,45" fill="#7DD87D" stroke="#2E6F38" stroke-width="4"/>
    </symbol>
    <symbol id="egg" viewBox="-30 -40 60 80">
      <ellipse cx="0" cy="0" rx="25" ry="35" fill="#FFF5E1" stroke="#D4A373" stroke-width="3"/>
      <circle cx="-8" cy="-10" r="4" fill="#FFB347"/>
      <circle cx="6" cy="5" r="5" fill="#FF9F40"/>
      <circle cx="0" cy="18" r="3" fill="#FFB347"/>
    </symbol>
    <symbol id="footprint" viewBox="-25 -30 50 60">
      <ellipse cx="0" cy="10" rx="15" ry="18" fill="#5BAA5B" opacity="0.7"/>
      <circle cx="-10" cy="-12" r="6" fill="#5BAA5B" opacity="0.7"/>
      <circle cx="0" cy="-18" r="6" fill="#5BAA5B" opacity="0.7"/>
      <circle cx="10" cy="-12" r="6" fill="#5BAA5B" opacity="0.7"/>
    </symbol>
  </defs>
  <rect width="1200" height="1800" fill="url(#bg)"/>
  <rect x="80" y="200" width="1040" height="1340" fill="#fff" rx="20"/>

  <!-- Top border decorations -->
  <use href="#dino" x="120" y="100" width="180" height="180"/>
  <use href="#egg" x="320" y="120" width="60" height="80"/>
  <use href="#leaf" x="400" y="100" width="80" height="80" transform="rotate(-15 440 140)"/>
  <use href="#leaf" x="500" y="80" width="100" height="100"/>
  <use href="#egg" x="620" y="130" width="50" height="65"/>
  <use href="#footprint" x="720" y="100" width="60" height="70"/>
  <use href="#leaf" x="820" y="110" width="80" height="80" transform="rotate(20 860 150)"/>
  <use href="#dino" x="950" y="80" width="180" height="180" transform="scale(-1,1) translate(-2080,0)"/>

  <!-- Left side -->
  <use href="#leaf" x="20" y="400" width="80" height="80"/>
  <use href="#footprint" x="30" y="600" width="50" height="60"/>
  <use href="#egg" x="20" y="800" width="60" height="80"/>
  <use href="#leaf" x="10" y="1000" width="90" height="90" transform="rotate(15 55 1045)"/>
  <use href="#footprint" x="30" y="1200" width="50" height="60"/>
  <use href="#leaf" x="20" y="1400" width="80" height="80"/>

  <!-- Right side -->
  <use href="#footprint" x="1120" y="400" width="50" height="60"/>
  <use href="#leaf" x="1100" y="600" width="90" height="90" transform="rotate(-15 1145 645)"/>
  <use href="#egg" x="1120" y="800" width="60" height="80"/>
  <use href="#leaf" x="1110" y="1000" width="80" height="80"/>
  <use href="#footprint" x="1120" y="1200" width="50" height="60"/>
  <use href="#leaf" x="1100" y="1400" width="90" height="90" transform="rotate(20 1145 1445)"/>

  <!-- Bottom border -->
  <use href="#leaf" x="100" y="1560" width="100" height="100"/>
  <use href="#dino" x="240" y="1560" width="170" height="170" transform="scale(-1,1) translate(-650,0)"/>
  <use href="#footprint" x="450" y="1620" width="50" height="60"/>
  <use href="#egg" x="540" y="1610" width="60" height="80"/>
  <use href="#footprint" x="640" y="1620" width="50" height="60"/>
  <use href="#egg" x="740" y="1610" width="50" height="65"/>
  <use href="#dino" x="850" y="1560" width="170" height="170"/>
  <use href="#leaf" x="1010" y="1560" width="100" height="100"/>

  <!-- "RAWR!" speech bubbles -->
  <g transform="translate(180,300)">
    <ellipse cx="0" cy="0" rx="55" ry="35" fill="#fff" stroke="#2E6F38" stroke-width="4"/>
    <text x="0" y="10" font-family="Comic Sans MS, sans-serif" font-size="34" font-weight="bold" fill="#FF6B6B" text-anchor="middle">RAWR!</text>
  </g>
</svg>
