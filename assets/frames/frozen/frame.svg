      <circle cx="0" cy="-90" r="4" fill="#fff"/>
    </symbol>
    <symbol id="iceCrystal" viewBox="-30 -50 60 100">
      <path d="M0,-45 L20,-15 L15,40 L0,45 L-15,40 L-20,-15 Z" fill="#A9DFFF" stroke="#5DADE2" stroke-width="2" opacity="0.85"/>
