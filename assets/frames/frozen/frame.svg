      <ellipse cx="0" cy="-30" rx="55" ry="60" fill="#FFE4D6" stroke="#D4A373" stroke-width="3"/>
      <circle cx="-18" cy="-30" r="6" fill="#1a1a1a"/>
      <circle cx="-15" cy="-33" r="2" fill="#fff"/>
      <circle cx="18" cy="-30" r="6" fill="#1a1a1a"/>
      <circle cx="21" cy="-33" r="2" fill="#fff"/>
      <ellipse cx="-25" cy="-15" rx="8" ry="4" fill="#FFB6C1" opacity="0.6"/>
      <ellipse cx="25" cy="-15" rx="8" ry="4" fill="#FFB6C1" opacity="0.6"/>
      <path d="M-8,-10 Q0,-5 8,-10" fill="none" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
      <path d="M-55,-50 Q-70,-20 -60,30 Q-45,40 -40,20 Q-50,0 -45,-30 Z" fill="#F4D03F" stroke="#D4A017" stroke-width="2"/>
      <path d="M55,-50 Q70,-20 60,30 Q45,40 40,20 Q50,0 45,-30 Z" fill="#F4D03F" stroke="#D4A017" stroke-width="2"/>
