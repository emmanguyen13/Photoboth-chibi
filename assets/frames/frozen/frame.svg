<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="iceBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0F4FF"/>
      <stop offset="0.5" stop-color="#B8E0F5"/>
      <stop offset="1" stop-color="#9DC8E8"/>
    </linearGradient>
    <radialGradient id="snowGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <symbol id="snowflake" viewBox="-50 -50 100 100">
      <g stroke="#5DADE2" stroke-width="3" stroke-linecap="round" fill="none">
        <line x1="0" y1="-45" x2="0" y2="45"/>
        <line x1="-45" y1="0" x2="45" y2="0"/>
        <line x1="-32" y1="-32" x2="32" y2="32"/>
        <line x1="-32" y1="32" x2="32" y2="-32"/>
        <path d="M0,-45 L-8,-35 M0,-45 L8,-35"/>
        <path d="M0,45 L-8,35 M0,45 L8,35"/>
        <path d="M-45,0 L-35,-8 M-45,0 L-35,8"/>
        <path d="M45,0 L35,-8 M45,0 L35,8"/>
        <path d="M-32,-32 L-22,-30 M-32,-32 L-30,-22"/>
        <path d="M32,32 L22,30 M32,32 L30,22"/>
        <path d="M-32,32 L-22,30 M-32,32 L-30,22"/>
        <path d="M32,-32 L22,-30 M32,-32 L30,-22"/>
