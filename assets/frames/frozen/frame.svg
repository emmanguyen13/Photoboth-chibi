  <use href="#iceCrystal" x="20" y="1200" width="60" height="100"/>
  <use href="#snowflake" x="20" y="1400" width="80" height="80"/>

  <!-- Right side -->
  <use href="#snowflake" x="1100" y="400" width="80" height="80"/>
  <use href="#iceCrystal" x="1120" y="600" width="50" height="80"/>
  <use href="#snowflake" x="1090" y="800" width="100" height="100"/>
  <use href="#snowflake" x="1110" y="1000" width="70" height="70"/>
  <use href="#iceCrystal" x="1120" y="1200" width="60" height="100"/>
  <use href="#snowflake" x="1100" y="1400" width="80" height="80"/>

  <!-- Bottom -->
  <use href="#snowflake" x="100" y="1560" width="90" height="90"/>
  <use href="#iceCrystal" x="220" y="1580" width="60" height="100"/>
  <use href="#snowflake" x="320" y="1570" width="80" height="80"/>
  <use href="#chibiPrincess" x="450" y="1530" width="180" height="220" transform="scale(-1,1) translate(-1080,0)"/>
  <use href="#snowflake" x="680" y="1570" width="80" height="80"/>
  <use href="#iceCrystal" x="780" y="1580" width="60" height="100"/>
  <use href="#snowflake" x="880" y="1570" width="90" height="90"/>
  <use href="#iceCrystal" x="990" y="1580" width="60" height="100"/>
  <use href="#snowflake" x="1080" y="1570" width="80" height="80"/>

