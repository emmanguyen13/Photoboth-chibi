  <rect width="1200" height="1800" fill="url(#iceBg)"/>
  <circle cx="200" cy="200" r="180" fill="url(#snowGlow)"/>
  <circle cx="1000" cy="1500" r="220" fill="url(#snowGlow)"/>
  <rect x="80" y="200" width="1040" height="1340" fill="#fff" rx="20"/>

